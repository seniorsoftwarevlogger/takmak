name: Publish Takmak website

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scene/package-lock.json
      - run: npm ci --prefix scene
      - run: npm --prefix scene run check
      - name: Prepare downloadable source packages
        run: python3 scene/scripts/prepare-downloads.py
      - name: Build website
        run: npm --prefix scene run build
        env:
          PAGES_BASE_PATH: /takmak/
      - name: Check published paths and downloads
        run: python3 scene/scripts/verify-site.py /takmak/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: scene/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
